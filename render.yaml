services:
  # Backend FastAPI Web Service
  - type: web
    name: mathgpt-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: qwen/qwen3.8-27b
      - key: NEO4J_URI
        value: ""
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        value: ""
      - key: DATABASE_URL
        value: "sqlite:///./math_learning.db"

  # Frontend Vite React Static Site
  - type: web
    name: mathgpt-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mathgpt-backend
          property: host
